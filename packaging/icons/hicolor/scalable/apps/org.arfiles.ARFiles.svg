<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- GNOME 50 Depth Filters -->
    <filter id="base-shadow" x="-20%" y="-20%" width="140%" height="145%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#05101e" flood-opacity="0.35"/>
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#05101e" flood-opacity="0.22"/>
    </filter>
    
    <filter id="emblem-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="3.5" stdDeviation="3" flood-color="#0a2444" flood-opacity="0.32"/>
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#0a2444" flood-opacity="0.18"/>
    </filter>

    <filter id="inner-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1" stdDeviation="0.8" flood-color="#000000" flood-opacity="0.2"/>
    </filter>

    <!-- GNOME / Libadwaita Color Gradients -->
    <!-- Back Tab -->
    <linearGradient id="folderBackGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1c71d8"/>
      <stop offset="25%" stop-color="#1a5fb4"/>
      <stop offset="100%" stop-color="#0f3b70"/>
    </linearGradient>

    <!-- Document Card -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="85%" stop-color="#f0f3f6"/>
      <stop offset="100%" stop-color="#e1e6ec"/>
    </linearGradient>

    <!-- Front Folder Body -->
    <linearGradient id="folderFrontGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4ea3f8"/>
      <stop offset="25%" stop-color="#3584e4"/>
      <stop offset="70%" stop-color="#1c71d8"/>
      <stop offset="100%" stop-color="#155bb0"/>
    </linearGradient>

    <!-- Cloud Emblem Base -->
    <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#f6f9fc"/>
      <stop offset="100%" stop-color="#d6e2ef"/>
    </linearGradient>

    <!-- Cloud Rim Highlight -->
    <linearGradient id="cloudRim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.1"/>
    </linearGradient>

    <!-- Sync Loop Gradients -->
    <linearGradient id="syncGrad1" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1c71d8"/>
      <stop offset="60%" stop-color="#3584e4"/>
      <stop offset="100%" stop-color="#33c7de"/>
    </linearGradient>

    <linearGradient id="syncGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c9da9"/>
      <stop offset="40%" stop-color="#3584e4"/>
      <stop offset="100%" stop-color="#1a5fb4"/>
    </linearGradient>
  </defs>

  <!-- ==================== LAYER 1: FOLDER REAR TAB ==================== -->
  <g filter="url(#base-shadow)">
    <!-- Back Tab Geometry: Curved Folder Ear -->
    <path d="M 18,28 C 18,22.5 22.5,18 28,18 L 52,18 C 56.5,18 60.5,20.8 63,24.5 L 67,30.5 C 69,33.5 72.5,35 76,35 L 100,35 C 105.5,35 110,39.5 110,45 L 110,62 L 18,62 Z"
          fill="url(#folderBackGrad)"/>
    <!-- Top Chamfer Highlight -->
    <path d="M 28,19 L 52,19 C 56,19 59.8,21.5 62.2,25.2 L 66.2,31.2 C 68.5,34.5 72.2,36 76,36 L 100,36 C 105,36 109,39.8 109,45"
          fill="none" stroke="#99c1f1" stroke-width="1.2" stroke-opacity="0.4" stroke-linecap="round"/>
  </g>

  <!-- ==================== LAYER 2: INSERTED FILE CARD ==================== -->
  <g filter="url(#base-shadow)">
    <!-- Document Card Body -->
    <rect x="28" y="24" width="72" height="42" rx="7" fill="url(#cardGrad)"/>
    <!-- Top Edge Highlight -->
    <path d="M 35,25 L 93,25" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round"/>

    <!-- Document Visual Metadata Rows -->
    <rect x="36" y="31" width="22" height="3.5" rx="1.75" fill="#3584e4" fill-opacity="0.8"/>
    <rect x="62" y="31" width="30" height="3.5" rx="1.75" fill="#9a9996" fill-opacity="0.35"/>
    <rect x="36" y="37.5" width="40" height="3" rx="1.5" fill="#c0bfbc" fill-opacity="0.45"/>
    <rect x="80" y="37.5" width="12" height="3" rx="1.5" fill="#33c7de" fill-opacity="0.6"/>
  </g>

  <!-- ==================== LAYER 3: FRONT FOLDER BODY ==================== -->
  <g filter="url(#base-shadow)">
    <!-- Main Front Folder Shape -->
    <rect x="14" y="38" width="100" height="74" rx="16" fill="url(#folderFrontGrad)"/>

    <!-- GNOME Signature Top Lip Highlight (Tactile 1px beveled light) -->
    <path d="M 30,39 L 98,39" stroke="#b5d6f8" stroke-width="1.4" stroke-linecap="round" stroke-opacity="0.9"/>

    <!-- Subtle Inner Border defining the crisp Libadwaita edge -->
    <rect x="14.5" y="38.5" width="99" height="73" rx="15.5" fill="none" stroke="#154889" stroke-width="0.75" stroke-opacity="0.35"/>

    <!-- Bottom Rim Darkening Shadow -->
    <path d="M 28,111 L 100,111" stroke="#0a2c54" stroke-width="1.6" stroke-linecap="round" stroke-opacity="0.45"/>
  </g>

  <!-- ==================== LAYER 4: CLOUD EMBLEM ==================== -->
  <g filter="url(#emblem-shadow)">
    <!-- Ambient Blue Radiance behind Cloud -->
    <ellipse cx="64" cy="74" rx="30" ry="18" fill="#62a0ea" fill-opacity="0.22"/>

    <!-- Perfected Symmetrical Cloud Silhouette (Center = 64, Base at 85) -->
    <path d="M 46.5,85
             C 40.5,85 35.5,80 35.5,74
             C 35.5,68 40.0,63.2 45.5,62.5
             C 47.5,54.5 54.5,48.5 63.5,48.5
             C 73.0,48.5 80.5,54.8 82.0,63
             C 87.5,63.8 92.0,68.5 92.0,74.5
             C 92.0,80.3 87.3,85 81.5,85
             Z"
          fill="url(#cloudGrad)"/>

    <!-- Cloud Top Inner Highlight -->
    <path d="M 46.2,63.2
             C 48.0,55.8 54.8,50 63.5,50
             C 72.3,50 79.2,55.8 81.0,63.2"
          fill="none" stroke="url(#cloudRim)" stroke-width="1.4" stroke-linecap="round"/>

    <!-- Cloud Left Crest Highlight -->
    <path d="M 37.5,73 C 37.5,69 40.2,65.5 44,64"
          fill="none" stroke="#ffffff" stroke-width="1" stroke-linecap="round" stroke-opacity="0.7"/>

    <!-- Cloud Base Lip Shadow -->
    <path d="M 46,84.5 L 82,84.5" stroke="#b4c7dc" stroke-width="1.2" stroke-linecap="round"/>

    <!-- ==================== LAYER 5: SYNC ORBIT DYNAMICS ==================== -->
    <g transform="translate(64, 69)">
      <!-- Upper Sync Arc (Flowing Clockwise to Right) -->
      <path d="M -13, -1
               A 13 13 0 0 1 10, -8"
            fill="none" stroke="url(#syncGrad1)" stroke-width="3" stroke-linecap="round"/>
      <!-- Upper Arrowhead -->
      <path d="M 8.5,-12.5 L 14,-7.5 L 8,-5.5 Z" fill="#33c7de"/>

      <!-- Lower Sync Arc (Flowing Clockwise to Left) -->
      <path d="M 13, 1
               A 13 13 0 0 1 -10, 8"
            fill="none" stroke="url(#syncGrad2)" stroke-width="3" stroke-linecap="round"/>
      <!-- Lower Arrowhead -->
      <path d="M -8.5,12.5 L -14,7.5 L -8,5.5 Z" fill="#1c71d8"/>

      <!-- Central Core: Storage Diamond / Local-First Node -->
      <rect x="-3" y="-3" width="6" height="6" rx="1.5" transform="rotate(45)" fill="#1c71d8"/>
      <rect x="-1.5" y="-1.5" width="3" height="3" rx="0.75" transform="rotate(45)" fill="#ffffff"/>
      <circle cx="0" cy="0" r="0.8" fill="#33c7de"/>
    </g>
  </g>
</svg>
