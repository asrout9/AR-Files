name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  backend:
    name: Backend (Rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libfuse3-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev appstream desktop-file-utils

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Check Formatting
        run: cargo fmt --check

      - name: Run Clippy
        run: cargo clippy --workspace -- -D warnings

      - name: Run Tests
        run: cargo test --workspace

      - name: Validate Packaging Metadata
        run: |
          desktop-file-validate packaging/desktop/*.desktop
          appstreamcli validate --no-net packaging/metainfo/*.metainfo.xml

  frontend:
    name: Frontend (React & TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: ui/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Check
        run: npm run typecheck

      - name: Run Unit Tests
        run: npm test -- --run

      - name: Build Web Assets
        run: npm run build
