[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/db",
    "crates/providers",
    "crates/sync",
    "crates/ops",
    "crates/platform",
    "crates/vfs",
    "src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["AR Files Contributors"]
license = "GPL-3.0-or-later"

[workspace.dependencies]
# Internal workspace crates
cirrus-core = { path = "crates/core" }
cirrus-db = { path = "crates/db" }
cirrus-providers = { path = "crates/providers" }
cirrus-sync = { path = "crates/sync" }
cirrus-ops = { path = "crates/ops" }
cirrus-platform = { path = "crates/platform" }
cirrus-vfs = { path = "crates/vfs" }

# Async & Concurrency
tokio = { version = "1.43", features = ["full"] }
async-trait = "0.1"

# Serialization & Identifiers
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.12", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# Database
rusqlite = { version = "0.33", features = ["bundled", "bundled-full", "chrono", "uuid", "backup"] }
r2d2 = "0.8"
r2d2_sqlite = "0.26"

# Error Handling & Observability
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json", "time"] }

# Filesystem & Utilities
sha2 = "0.10"
hex = "0.4"
notify = { version = "8.0", features = ["serde"] }
walkdir = "2.5"
url = "2.5"
bytes = "1.10"
parking_lot = "0.12"
bitflags = { version = "2.8", features = ["serde"] }
tempfile = "3.17"
